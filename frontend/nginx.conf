server {
    listen 80;
    server_name tech-mind.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tech-mind.duckdns.org;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/tech-mind.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tech-mind.duckdns.org/privkey.pem;

    # Arquivos com hash no nome (JS/CSS) podem ser cacheados por muito tempo:
    # o nome do arquivo muda a cada build, então nunca serve conteúdo velho.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # O index.html precisa ser revalidado sempre, senão o navegador (ou proxies
    # de operadoras) pode reter uma versão velha mesmo após um novo deploy.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location /conteudo {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
